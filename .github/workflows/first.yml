name: first
on: 
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
      
jobs:
  job1:
    name: First job
    runs-on: ubuntu-latest
    steps:
      - name: step one
        uses: actions/checkout@v2
      - name: step two
        run: env | sort
  job2:
    name: Second job
    runs-on: windows-latest
    steps:
      - name: step one
        uses: actions/checkout@v2
      - name: step two
        run: | 
          "Get-ChildItem Env: | Sort-Object Name"
          "the MY_ACCOUNT is : ${{ env.MY_ACCOUNT }}"
